<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Психологическая поддержка</title>
    <link rel="stylesheet" href="../styles/reset.css">
    <link rel="stylesheet" href="../styles/supportchat.css">
</head>
<body>
    <header class="supportchat_screen_header">
        <button class="sprch_btn" onclick="window.location.href='page8.html'"> 
            <img src="../styles/icons/Vector_strelo4ka_back.svg" alt="Назад"> 
        </button>
        <div class="sprch_chattitle">
            <p class="sprch_chattitle_p">Психологическая поддержка</p>
        </div>
        <button class="sprch_btn"> 
            <img src="../styles/icons/Vector_sound.svg" alt="Звук"> 
        </button>
    </header>

    <div class="supportchat_body" id="messages"></div>      

    <footer class="supportchat_keyboardblock">
        <div class="supportchat_keyboardblock_wrapper">
            <button class="supportchat_keyboardblock_btn"> 
                <img src="../styles/icons/Vector_plusik.svg" alt="Прикрепить файл"> 
            </button>
            <input type="text" class="supportchat_keyboardblock_input" placeholder="Опишите свою проблему" id="messageInput">
            <button class="supportchat_keyboardblock_btn" onclick="sendMessage()" id="sendButton"> 
                <img src="../styles/icons/Vector_strelo4ka_send.svg" alt="Отправить"> 
            </button>
        </div>
    </footer>
    <script src="../backend/support-chat.js"></script>
</body>
</html>
