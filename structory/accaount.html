<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="../styles/reset.css">
    <link rel="stylesheet" href="../styles/account.css">
</head>
<body>
    <div class="account-container">
        <h1>Мой аккаунт</h1>

        <img id="avatarPreview" class="avatar-preview" src="https://via.placeholder.com/100" alt="Аватар">

        <div class="form-group">
            <label for="firstName">Имя:</label>
            <input type="text" id="firstName" placeholder="Имя">
        </div>

        <div class="form-group">
            <label for="lastName">Фамилия:</label>
            <input type="text" id="lastName" placeholder="Фамилия">
        </div>

        <div class="form-group">
            <label for="phone">Номер телефона:</label>
            <input type="tel" id="phone" placeholder="+7 (XXX) XXX-XX-XX">
        </div>

        <button onclick="saveAccount()">Сохранить</button>
    </div>
</body>
</html>
